name: Publish cinema map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:17 and 13:17 Bali time (WITA); GitHub may delay scheduled jobs.
    - cron: '17 23,5 * * *'

permissions:
  contents: read

concurrency:
  group: cinema-pages
  cancel-in-progress: false

jobs:
  build:
    # Manual refreshes are reserved for the repository owner.
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schedule parser
        run: python -m pip install beautifulsoup4==4.13.3
      - name: Check schedule parsing
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check showtime sorting and movie formats
        run: node --test scripts/test_showtime_utils.cjs
      - name: Check owner refresh authorization
        run: node --test owner-service/worker.test.mjs
      - name: Refresh movie listings
        run: python scripts/refresh_showtimes.py
      - name: Save validated snapshot for repository backup
        uses: actions/upload-artifact@v4
        with:
          name: movie-snapshot
          path: showtimes.json
          retention-days: 1
          if-no-files-found: error
      - name: Package public files
        run: |
          mkdir _site
          cp index.html app.js showtime-utils.js owner-refresh.js owner-refresh-config.json style.css cinemas.json showtimes.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  save-snapshot:
    # Real data commits keep the repository active beyond GitHub's 60-day limit.
    # Only this job can write contents; scraping and deployment remain separate.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: movie-snapshot
          path: .snapshot
      - name: Commit published movie snapshot
        run: python scripts/save_snapshot.py .snapshot/showtimes.json
