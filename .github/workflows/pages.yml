name: Publish cinema map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:17 and 13:17 Bali time (WITA); GitHub may delay scheduled jobs.
    - cron: '17 23,5 * * *'

permissions:
  contents: read

concurrency:
  group: cinema-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schedule parser
        run: python -m pip install beautifulsoup4==4.13.3
      - name: Check schedule parsing
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check showtime sorting and movie formats
        run: node --test scripts/test_showtime_utils.cjs
      - name: Refresh movie listings
        run: python scripts/refresh_showtimes.py
      - name: Package public files
        run: |
          mkdir _site
          cp index.html app.js showtime-utils.js style.css cinemas.json showtimes.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
