# Secrets, entered with wrangler secret put: GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET, SESSION_SECRET (at least 32 random bytes, base64url).
# Deploy only after confirming this account uses Workers Free.
# One dedicated KV namespace uses Workers Free quotas. No paid plan,
# custom domain, or observability is enabled. Quota exhaustion fails closed.

[[kv_namespaces]]
binding = "PUSH_DEVICES"
id = "2fb20ed5cf2a484894be8ac56986f445"

# SQLite-backed Durable Objects are included on Workers Free; limits fail closed.
# Private session storage serializes GitHub refresh-token rotation across tabs.
[[durable_objects.bindings]]
name = "OWNER_SESSIONS"
class_name = "OwnerSession"

[[migrations]]
tag = "owner-sessions-v1"
new_sqlite_classes = ["OwnerSession"]
